services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: voca3000
      POSTGRES_USER: voca3000
      POSTGRES_PASSWORD: voca3000
    ports:
      - "5432:5432"
    volumes:
      - voca3000-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voca3000 -d voca3000"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  voca3000-postgres:
