spring:
  application:
    name: voca3000-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/voca3000}
    username: ${DB_USERNAME:voca3000}
    password: ${DB_PASSWORD:voca3000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
