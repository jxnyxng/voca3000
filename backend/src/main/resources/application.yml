spring:
  application:
    name: voca3000-backend
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        max-age: 30d

management:
  endpoints:
    web:
      exposure:
        include: health,info
